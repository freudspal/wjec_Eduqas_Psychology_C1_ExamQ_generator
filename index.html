let remaining = [...allQuestions];
let current = null;
let rotation = 0;
let timerInterval = null;

const wheel = document.getElementById("wheel");

/* ✅ skill from wheel */
function getSkill(rot){
  let angle = rot % 360;
  if(angle < 120) return "AO1";
  if(angle < 240) return "AO2";
  return "AO3";
}

/* ✅ SPIN - fully working */
function spin(){

  if(remaining.length === 0){
    document.getElementById("output").innerHTML =
      "<b>All questions used. Press RESET.</b>";
    return;
  }

  const spinAmount = 720 + Math.random()*360;
  rotation += spinAmount;

  wheel.style.transform = `rotate(${rotation}deg)`;

  setTimeout(()=>{

    const skill = getSkill(rotation);
    const pool = remaining.filter(q => q.s === skill);

    if(pool.length === 0){
      document.getElementById("output").innerHTML =
        `<b>${skill} selected</b><br>No questions left.`;
      current = null;
      return;
    }

    const index = Math.floor(Math.random()*pool.length);
    current = pool[index];

    remaining = remaining.filter(q => q !== current);

    document.getElementById("output").innerHTML =
      `<b>${current.q}</b><br>
      <b>Marks: ${current.m} | Skill: ${current.s}</b>`;

    clearInterval(timerInterval);
    document.getElementById("timer").innerHTML = "";

  },2500);
}

/* ✅ TIMER */
function startTimer(){

  if(!current) return;

  clearInterval(timerInterval);
  document.getElementById("alarm").pause();
  document.getElementById("alarm").currentTime = 0;

  let time = current.m * 95;

  updateTimer(time);

  timerInterval = setInterval(()=>{
    time--;
    updateTimer(time);

    if(time <= 0){
      clearInterval(timerInterval);
      document.getElementById("timer").innerHTML = "⏰ TIME UP!";
      document.getElementById("alarm").play();
    }

  },1000);
}

function updateTimer(t){
  const m = Math.floor(t/60);
  const s = t % 60;
  document.getElementById("timer").innerHTML =
    `${m}:${s.toString().padStart(2,"0")}`;
}

/* controls */
function nextQuestion(){ spin(); }

function resetWheel(){
  remaining = [...allQuestions];
  current = null;
  rotation = 0;

  wheel.style.transform = "rotate(0deg)";
  document.getElementById("output").innerHTML = "<b>Reset complete</b>";
  document.getElementById("timer").innerHTML = "";

  clearInterval(timerInterval);
}
