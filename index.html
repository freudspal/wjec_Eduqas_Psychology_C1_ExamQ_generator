/* ✅ STATE */
let current = null;
let usedQuestions = [];
let rotation = 0;
let timerInterval = null;

const wheel = document.getElementById("wheel");

/* ✅ FILTER LOGIC */
function getFullFilteredPool(){

  const skills = Array.from(document.querySelectorAll("input[value^='AO']:checked"))
                      .map(cb => cb.value);

  const papers = Array.from(document.querySelectorAll("input[value='AS'], input[value='A']"))
                      .filter(cb => cb.checked)
                      .map(cb => cb.value);

  const tags = Array.from(document.querySelectorAll("input[type=checkbox]"))
                    .filter(cb =>
                      cb.checked &&
                      !cb.value.startsWith("AO") &&
                      cb.value !== "AS" &&
                      cb.value !== "A"
                    )
                    .map(cb => cb.value);

  return allQuestions.filter(q =>
    skills.includes(q.s) &&
    papers.includes(q.paper) &&
    tags.includes(q.tag) &&
    !usedQuestions.includes(q)
  );
}



/* ✅ SPIN */
function spin(){

  let spinAmount = 720 + Math.random()*360;
  rotation += spinAmount;
  wheel.style.transform = `rotate(${rotation}deg)`;

  setTimeout(()=>{

    // ✅ FULL FILTERED POOL (NO SKILL FROM WHEEL)
    let pool = getFullFilteredPool();

    if(pool.length === 0){
      document.getElementById("output").innerHTML =
        "<b>No matching questions — adjust filters</b>";
      return;
    }

    let index = Math.floor(Math.random()*pool.length);
    current = pool[index];

    usedQuestions.push(current);

    // ✅ Display (skill still shown, just not controlled by wheel)
    document.getElementById("output").innerHTML =
      `<div class="highlight ${current.s}">Skill: ${current.s}</div>
       <b>${current.q}</b><br>
       Marks: ${current.m} | Paper: ${current.paper} | Year: ${current.year} | Tag: ${current.tag}`;

    clearInterval(timerInterval);
    document.getElementById("timer").innerHTML="";

  },2500);
}


/* ✅ TIMER (95 sec per mark) */
function startTimer(){
  if(!current) return;

  clearInterval(timerInterval);

  let time = current.m * 95;

  update(time);

  timerInterval = setInterval(()=>{
    time--;
    update(time);

    if(time<=0){
      clearInterval(timerInterval);
      document.getElementById("timer").innerHTML="⏰ TIME UP!";
    }
  },1000);
}

function update(t){
  let m = Math.floor(t/60);
  let s = t % 60;
  document.getElementById("timer").innerHTML =
    `${m}:${s.toString().padStart(2,"0")}`;
}

/* ✅ RESET */
function resetWheel(){
  usedQuestions = [];
  rotation = 0;
  current = null;
  wheel.style.transform = "rotate(0deg)";
  document.getElementById("output").innerHTML = "<b>Reset complete</b>";
  document.getElementById("timer").innerHTML="";
}

</script>
